<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#128c7e">
  <title>VoiceBrief</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="update" class="banner" hidden>Nuova versione disponibile. <button id="reload">Aggiorna</button></div>
  <main>
    <h1>VoiceBrief</h1>
    <p id="status" class="muted"></p>

    <section id="pick" hidden>
      <h2>Come vuoi elaborare questo vocale?</h2>
      <div id="modes" role="radiogroup">
        <label class="mode"><input type="radio" name="mode" value="full"><span><b>Trascrizione completa</b><small>Testo integrale e leggibile</small></span></label>
        <label class="mode"><input type="radio" name="mode" value="bullets"><span><b>Riassunto per punti</b><small>Bullet chiari</small></span></label>
        <label class="mode"><input type="radio" name="mode" value="short"><span><b>Riassunto sintetico</b><small>Il minimo indispensabile</small></span></label>
        <label class="mode"><input type="radio" name="mode" value="todo"><span><b>Cose da fare</b><small>Azioni, decisioni, scadenze, appuntamenti</small></span></label>
      </div>
      <button id="go" class="primary">Elabora</button>
      <audio id="player" controls></audio>
      <details>
        <summary>Dettagli file</summary>
        <dl>
          <dt>Nome</dt><dd id="f-name"></dd>
          <dt>MIME</dt><dd id="f-type"></dd>
          <dt>Dimensione</dt><dd id="f-size"></dd>
          <dt>Durata</dt><dd id="f-dur"></dd>
        </dl>
      </details>
      <button id="clear" class="link">Elimina audio</button>
    </section>

    <section id="result" hidden>
      <h2 id="result-title"></h2>
      <pre id="out"></pre>
      <div class="row">
        <button id="copy" class="primary">Copia</button>
        <button id="share">Condividi</button>
      </div>
      <button id="again" class="link">Cambia modalità</button>
    </section>

    <p class="muted small" id="env"></p>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
